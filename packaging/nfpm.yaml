name: provctl
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Jozue Kupec <jozuekupec80@gmail.com>
description: |
  Web hosting management for Debian servers.
  Manage hosting subscriptions, Apache websites, PHP-FPM versions, MariaDB
  databases, TLS certificates, backups, scheduled jobs, and SSH access through
  a command-line interface and an interactive terminal dashboard.
  Generate server configuration from managed state with operation journaling,
  health checks, and rollback support.
homepage: https://github.com/jozuekupec/provctl
license: GPL-3.0-only
changelog: ./packaging/debian/changelog.yaml

depends:
  - adduser
  - apache2
  - cron
  - zstd
recommends:
  - certbot
  - logrotate
  - mariadb-client
suggests:
  - php-fpm

contents:
  - src: ./dist/provctl
    dst: /usr/bin/provctl
    file_info:
      mode: 0755
  - src: ./templates/apache/
    dst: /usr/share/provctl/templates/apache/
    file_info:
      mode: 0644
  - src: ./templates/bootstrap/
    dst: /usr/share/provctl/templates/bootstrap/
    file_info:
      mode: 0644
  - src: ./templates/fpm/
    dst: /usr/share/provctl/templates/fpm/
    file_info:
      mode: 0644
  - src: ./packaging/config.toml.default
    dst: /etc/provctl/config.toml
    type: config|noreplace
    file_info:
      mode: 0640
  - src: ./packaging/logrotate.provctl
    dst: /etc/logrotate.d/provctl
    type: config|noreplace
    file_info:
      mode: 0644
  - src: ./packaging/debian/copyright
    dst: /usr/share/doc/provctl/copyright
    file_info:
      mode: 0644
  - src: ./packaging/debian/lintian-overrides
    dst: /usr/share/lintian/overrides/provctl
    file_info:
      mode: 0644
  - dst: /var/lib/provctl
    type: dir
    file_info:
      mode: 0700
  - dst: /var/lib/provctl-acme-challenge
    type: dir
    file_info:
      mode: 0755
  - dst: /var/log/provctl
    type: dir
    file_info:
      mode: 0750

scripts:
  postinstall: ./packaging/debian/postinst
  postremove: ./packaging/debian/postrm
