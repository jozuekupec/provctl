name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          check-latest: true
      - run: go mod tidy
      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - run: go test ./... -race -count=1

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          check-latest: true
      - name: Install package tooling
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          sudo apt-get update
          sudo apt-get install -y lintian
      - name: Build Debian package
        env:
          VERSION: 0.0.0~ci
          ARCH: amd64
        run: ./scripts/build-deb.sh
      - name: Inspect Debian package
        run: |
          lintian --no-tag-display-limit dist/provctl_*.deb
          dpkg-deb --contents dist/provctl_*.deb
          dpkg-deb --info dist/provctl_*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: provctl-deb-amd64
          path: dist/*.deb
