name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go mod tidy
      - run: go vet ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - run: go test ./... -race -count=1

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install package tooling
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          sudo apt-get update
          sudo apt-get install -y lintian
      - name: Build Debian package
        env:
          VERSION: 0.0.0~ci
          ARCH: amd64
        run: ./scripts/build-deb.sh
      - name: Inspect Debian package
        run: |
          lintian --no-tag-display-limit dist/provctl_*.deb
          dpkg-deb --contents dist/provctl_*.deb
          dpkg-deb --info dist/provctl_*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: provctl-deb-amd64
          path: dist/*.deb

  piuparts:
    needs: package
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: provctl-deb-amd64
          path: dist
      - name: Test Debian install and purge
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y piuparts debootstrap
          piuparts --distribution trixie --mirror http://deb.debian.org/debian dist/provctl_*.deb
