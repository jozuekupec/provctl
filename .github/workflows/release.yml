name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          check-latest: true
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Build Debian package
        env:
          ARCH: ${{ matrix.arch }}
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: debian
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          fail_on_unmatched_files: true
          files: dist/*.deb

  publish-apt:
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: apt-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install APT tooling
        run: sudo apt-get update && sudo apt-get install -y apt-utils
      - name: Download all published packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/download-release-debs.py "$GITHUB_REPOSITORY" incoming
      - name: Build signed APT repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          trap 'gpgconf --kill gpg-agent' EXIT
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          unset APT_GPG_PRIVATE_KEY
          export APT_SIGNING_FPR="$(sed -n 's/^SignWith: \([A-F0-9]*\)!$/\1/p' packaging/apt/distributions | sort -u)"
          sh scripts/build-apt-repo.sh incoming out
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Deploy APT repository
        id: deployment
        uses: actions/deploy-pages@v4
